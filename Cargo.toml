[package]
name = "tuxmate-companion"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "tuxmate"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
# axum = "0.8.9"
clap = { version = "4.6.1", features = ["derive"] }
# color-eyre = "0.6.5"
colored = "3.1.1"
# crossterm = "0.29.0"
# portable-pty = "0.9.0"
# ratatui = "0.30.2"
reqwest = "0.13.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
# socketioxide = "0.18.3"
tokio = { version = "1.52.3", features = ["full"] }
inquire = "0.9.4"
strum = { version = "0.28.0", features = ["strum_macros", "derive"] }
# tower = "0.5.3"
# tower-http = { version = "0.7.0", features = ["cors"] }
# tracing = "0.1.44"
# tracing-subscriber = "0.3.23"
# tui-term = "0.3.4"
