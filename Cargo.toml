[package]
name = "tuxmate-companion"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.1", features = ["derive"] }
color-eyre = "0.6.5"
crossterm = "0.29.0"
portable-pty = "0.9.0"
ratatui = "0.30.2"
reqwest = "0.13.4"
serde = { version = "1.0.228", features = ["derive"] }
